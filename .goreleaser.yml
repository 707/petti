version: 2

project_name: petti

before:
  hooks:
    - go test ./...

builds:
  - id: petti
    main: ./cmd/petti/main.go
    binary: petti
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - "^test:"
      - "^docs:"

release:
  draft: false
  prerelease: auto
